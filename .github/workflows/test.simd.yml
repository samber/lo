name: Tests (SIMD)

on:
  push:
    branches:
      - master
    paths:
      - 'exp/simd/**'
  pull_request:
    paths:
      - 'exp/simd/**'

env:
  GOEXPERIMENT: simd

jobs:
  test-simd:
    # GitHub hosted runners run on several architectures.
    # Using Ubicloud ensures we run on AVX512. Run on both x86 and arm
    # to cover the full Ubicloud fleet.
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubicloud-standard-2
          - ubicloud-standard-2-arm
        go:
          - "1.26"
          - "1.27"
          - "stable" # for future versions
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: make test

      - name: Benchmark
        run: |
          cd exp/simd/
          GOEXPERIMENT=simd go test -run=^Benchmark -benchmem -bench ./...
